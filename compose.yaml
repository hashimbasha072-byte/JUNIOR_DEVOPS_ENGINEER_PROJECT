services:
  api:
    image: apex-operations-api:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: INFO
      DEPENDENCY_AVAILABLE: ${DEPENDENCY_AVAILABLE:-true}
    restart: unless-stopped
